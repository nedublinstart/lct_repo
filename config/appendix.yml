laying-methods:
  default: base
  base:
    title: Обычная прокладка
  special:
    title: Специальный проход

constraints:
  oks:
    action: AVOID
    buffer_m: 1
  oks_existing:
    action: AVOID
    buffer_m: 1
  existing_building:
    action: AVOID
    buffer_m: 1
  park:
    action: AVOID
    buffer_m: 1
  social_area:
    action: AVOID
    buffer_m: 1
  prohibited_site:
    action: AVOID
    buffer_m: 1
  water:
    action: AVOID
    buffer_m: 1
  road:
    action: SPECIAL
    min_angle_deg: 45
    extra_grid_cost: 12
    k_spec: 1.60
    extend_m: 3
    method: special
  tram_tracks:
    action: SPECIAL
    min_angle_deg: 45
    extra_grid_cost: 14
    k_spec: 1.75
    extend_m: 3
    method: special
  railway:
    action: AVOID
    buffer_m: 5
  gas_pipeline:
    action: SPECIAL
    extra_grid_cost: 6
    k_spec: 1.25
    extend_m: 2
    method: special
  power_cable:
    action: SPECIAL
    extra_grid_cost: 5
    k_spec: 1.15
    extend_m: 2
    method: special
  heat_network:
    action: SPECIAL
    extra_grid_cost: 3
    k_spec: 1.05
    extend_m: 2
    method: special
  default:
    action: AVOID
    buffer_m: 2

costs:
  tap_in_pipe: 5000000
  tap_in_chamber: 5000000
  unconnected_fixed: 100000000
  unconnected_per_tph: 500000
  new_chamber_tiers:
    - { max_dn: 200, cost: 3000000 }
    - { max_dn: 500, cost: 5000000 }
    - { max_dn: 1000, cost: 8000000 }
    - { max_dn: 1400, cost: 12000000 }

ranking:
  cost_weight: 0.7
  length_weight: 0.3
  cost_base: 25000000
  length_base: 100

depth:
  enabled-extra: true
  z_ground: 0
  step_m: 0.5
  min_depth_m: 0.7
  max_depth_m: 8.0
  default_depth_m: 3.0
  cost_factor_per_m_depth: 0.10
  max_slope: 0.10
  utility_depth_m:
    gas_pipeline: 2.8
    power_cable: 2.7
    heat_network: 3.0
    road: 0.0
    tram_tracks: 0.0
  clearance_m: 0.5

export:
  collection-name: heatnet-result
