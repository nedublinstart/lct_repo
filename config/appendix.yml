# Официальное техническое приложение ЛЦТ 2026.
# Файл перечитывается перед каждым расчётом.

meta:
  title: "Техническое приложение к кейсу моделирования трасс тепловых сетей"
  official: true
  crs_calc: EPSG:32637
  crs_io: EPSG:4326

aliases:
  id: [id, ID, object_id, OBJECTID, fid]
  kind: [object_type, feature_type, type, layer, class, kind]
  dn: [diameter, dn, DN, diametr, d_u, Dy]
  flow: [flow_tph, flow, q, G, existing_flow, design_flow]
  next_id: [upstream_object_id, next_id, nextId, next_object_id, id_next]
  heat_load: [heat_load, Q, nagruzka]
  oks_id: [oks_id, oksId, building_id, id_oks, parent_id]
  constraint_type: [restriction_type, constraint_type, type]
  name: [name, title, nazvanie, address]

feature-kinds:
  existing_segment:
    type-values: [heat_network, existing_segment, teploset]
    geometry: LineString
  chamber:
    type-values: [heat_chamber, chamber, tk]
    geometry: Point
  source:
    type-values: [source, heat_source, istochnik]
    geometry: Point
  oks_prospective:
    type-values: [oks_future, oks_prospective, oks]
    geometry: Polygon
  oks_existing:
    type-values: [oks_existing]
    geometry: Polygon
  connection_point:
    type-values: [oks_connection_point, connection_point]
    geometry: Point
  constraint:
    type-values: [restriction, constraint]
    geometry: Polygon

routing:
  grid-max-cells: 640
  min-cell-m: 2.0
  tap-merge-m: 10
  chamber-snap-m: 10
  turn-keep-deg: 16
  max-path-iterations: 1000000
  endpoint-snap-m: 4.0
  candidate-step-m: 30
  max-chamber-degree: 4
  block-close-m: 10
  clearance-m: 2.0
  path-width-m: 0.6

diameters:
  - { dn: 50,   capacity_tph: 3.5,     max_run_m: 181,   width_m: 0.400, height_m: 0.125, min_depth_m: 0.7, new_per_m: 74023,  recon_per_m: 96180 }
  - { dn: 65,   capacity_tph: 8.3,     max_run_m: 245,   width_m: 0.430, height_m: 0.140, min_depth_m: 0.7, new_per_m: 78631,  recon_per_m: 109989 }
  - { dn: 80,   capacity_tph: 13.2,    max_run_m: 327,   width_m: 0.470, height_m: 0.160, min_depth_m: 0.7, new_per_m: 83530,  recon_per_m: 117582 }
