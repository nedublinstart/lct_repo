  - { dn: 250,  capacity_tph: 274.9,   max_run_m: 1379,  width_m: 1.050, height_m: 0.400, min_depth_m: 0.7, new_per_m: 135323, recon_per_m: 202030 }
  - { dn: 300,  capacity_tph: 437.4,   max_run_m: 1718,  width_m: 1.150, height_m: 0.450, min_depth_m: 0.7, new_per_m: 150022, recon_per_m: 228707 }
  - { dn: 400,  capacity_tph: 943.1,   max_run_m: 2477,  width_m: 1.370, height_m: 0.560, min_depth_m: 0.7, new_per_m: 190299, recon_per_m: 271317 }
  - { dn: 500,  capacity_tph: 1663.4,  max_run_m: 3245,  width_m: 1.670, height_m: 0.710, min_depth_m: 0.7, new_per_m: 224137, recon_per_m: 333884 }
